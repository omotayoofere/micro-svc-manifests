
name: Build, Test and deploy Emart App from external trigger
on:
  repository_dispatch:
    types: [Triggered-from-App-repo]
jobs:
  setup:
    name: Checkout repository and set metadata
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.build_data.outputs.commit_hash }}
      build_number: ${{ steps.build_data.outputs.build_number }}
      timestamp: ${{ steps.build_data.outputs.timestamp }}
      build_platform: ${{ steps.build_data.outputs.build_platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          repository: ${{ vars.REPO_URL }}
          ref: ${{ vars.REPO_BRANCH }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-tags: true
          lfs: true
          
      - name: Generate Build Metadata
        id: build_data
        run: | 
          echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "build_platform=GITHUB_ACTION" >> $GITHUB_OUTPUT

  build_and_push:
    name: Build_and_Push_Docker_Images
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        app: [client, nodeapi, javaapi]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.REPO_URL }}
          ref: ${{ vars.REPO_BRANCH }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-tags: true
          lfs: true
      - name: Docker Login
        uses: docker/login-action@v3.5.0
        with: 
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Debug Output Values
        run: |
          echo "Commit Hash: ${{ needs.setup.outputs.commit_hash }}"
          echo "Timestamp: ${{ needs.setup.outputs.timestamp }}"
          echo "Build Number: ${{ needs.setup.outputs.build_number }}"
          echo "Build Platform: ${{ needs.setup.outputs.build_platform }}"

      - name: Docker Build and Push
        run: |
          IMAGE_NAME=${{ vars.DOCKER_USERNAME }}/${{ matrix.app }}
          
          echo "Building Docker Image for ${{ matrix.app }}"

          cd ${{ matrix.app }}
          
          docker build -t $IMAGE_NAME:latest .
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:${{ needs.setup.outputs.commit_hash }}
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:${{ needs.setup.outputs.timestamp }}
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:${{ needs.setup.outputs.build_number }}
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:${{ needs.setup.outputs.build_platform }}

          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ needs.setup.outputs.commit_hash }}
          docker push $IMAGE_NAME:${{ needs.setup.outputs.timestamp }}
          docker push $IMAGE_NAME:${{ needs.setup.outputs.build_number }}
          docker push $IMAGE_NAME:${{ needs.setup.outputs.build_platform }}

      
  update_gitops:
    name: Update GitOps repository
    runs-on: ubuntu-latest
    needs: [setup, build_and_push]
    steps:
      - name: Checkout GitOps repo
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          git clone -b k8s https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/omotayoofere/emartProject-admin.git gitops
          cd gitops
          
          git config user.name "Github Actions"
          git config user.name "actions@github.com"
          
          sed -i 's/^ *newTag: .*/ newTag:${{ needs.setup.outputs.build_number }}/g' kubernetes-manifest/overlays/prod/canary-prod/kustomization.yaml

          git add kubernetes-manifest/overlays/prod/canary-prod/kustomization.yaml
          git commit --allow-empty -m "Update image to ${{ needs.setup.outputs.build_number }}"

          git push -f https://github.com/omotayoofere/emartProject-admin.git k8s
