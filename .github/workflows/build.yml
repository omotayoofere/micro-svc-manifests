name: Build, Test and deploy <inserts project name>
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          repository: ${{ secret.repository }}
          ref: kube
          token: ${{ secrets.PIPELINE_TOKEN }}
          fetch-tags: true
          lfs: true
