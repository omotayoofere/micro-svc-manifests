name: Build, Test and deploy Emart App
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Checkout REPO and containerize applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          repository: ${{ vars.REPO_URL }}
          ref: ${{ vars.REPO_BRANCH }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-tags: true
          lfs: true
          
      - name: Print Output
        id: vars
        run: | 
          echo "commit_hash=$(git rev-parse --short HEAD)"
          echo "timestamp=$(date +%Y%m%d%H%M%S)"
          echo "build_number=${{ github.run_number }}"
