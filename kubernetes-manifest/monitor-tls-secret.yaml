apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitor-tls-secret
  namespace: monitoring
spec:
  refreshInterval: "30m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: monitor-tls-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: secret/data/k8s/tls/monitor-ingress
      property: tls.crt
  - secretKey: tls.key
    remoteRef:
      key: secret/data/k8s/tls/monitor-ingress
      property: tls.key
