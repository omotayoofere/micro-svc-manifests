apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi-deploy
  namespace: emart-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapi-pod
  template:
    metadata:
      labels:
        app: webapi-pod
    spec:
      # serviceAccountName: aws-secret-sa
      # imagePullSecrets:
      # - name: ghcr-secret
      # affinity:
      #   podAntiAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #     - weight: 100
      #       podAffinityTerm:
      #         topologyKey: topology.kubernetes.io/hostname
      #         labelSelector:
      #           matchLabels:
      #             app: security
      terminationGracePeriodSeconds: 120
      restartPolicy: Always
      # volumes:
      # - name: secrets-store-inline
      #   csi:
      #     driver: secrets-store.csi.k8s.io
      #     readOnly: true
      #     volumeAttributes:
      #       secretProviderClass: aws-secrets
      containers:
      - name: webapi-container
        image: ghcr.io/omotayoofere/java-api:sha-abe18ae
        ports:
        - containerPort: 9000
          name: webapi-port
        resources:
          requests:
            cpu: "0.5"
            memory: "600Mi"
          limits:
            cpu: "0.5"
            memory: "600Mi"
        # volumeMounts:
        #     - name: secrets-store-inline
        #       mountPath: /mnt/secrets
        #       readOnly: true
        readinessProbe:
          tcpSocket:
            port: webapi-port
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 5
        livenessProbe:
          tcpSocket:
            port: webapi-port
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 10
        startupProbe:
          tcpSocket:
            port: webapi-port
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: webapi-svc
  namespace: emart-app
spec:
  selector:
    app: webapi-pod
  ports:
  - protocol: TCP
    port: 9000
    targetPort: webapi-port
    
