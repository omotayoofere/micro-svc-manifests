apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: logging
data:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {

    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch-svc.logging.svc.cluster.local:9200"]
        index => "fileneat-%{+YYYY.MM.dd}"
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
spec:
  selector:
    matchLabels:
      app: logstash-pod
  replicas: 1
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: logstash-pod
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 120
      volumes:
      - name: config-volume
        configMap:
          name: logstash-config
          items:
            - key: logstash.conf
              path: logstash.conf
      containers:
      - name: logstash-container
        image: docker.elastic.co/logstash/logstash:7.17.0
        resources:
          requests:
            cpu: "100m"
            memory: "1Gi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        volumeMounts:
          - name: config-volume
            mountPath: /usr/share/logstash/pipeline/logstash.conf
            subPath: logstash.conf
        ports:
          - containerPort: 5044
            name: logstash-port
          - containerPort: 9600
        readinessProbe:
          tcpSocket:
            port: logstash-port
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: logstash-port
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 20
        startupProbe:
          tcpSocket:
            port: logstash-port
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 20
        
---
apiVersion: v1
kind: Service
metadata:
  name: logstash-svc
  namespace: logging
spec:
  selector:
    app: logstash-pod
  ports:
  - protocol: TCP
    port: 5044
    targetPort: logstash-port
